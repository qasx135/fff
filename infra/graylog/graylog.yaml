apiVersion: apps/v1
kind: Deployment
metadata:
  name: graylog
  labels:
    app: graylog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graylog
  template:
    metadata:
      labels:
        app: graylog
    spec:
      containers:
      - name: graylog
        image: graylog/graylog:4.3
        env:
        - name: GRAYLOG_PASSWORD_SECRET
          value: "somepasswordpepper"
        - name: GRAYLOG_ROOT_PASSWORD_SHA2
          value: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
        - name: GRAYLOG_HTTP_EXTERNAL_URI
          value: "http://localhost:9000/"
        - name: GRAYLOG_MONGODB_URI
          value: "mongodb://mongodb:27017/graylog"
        - name: GRAYLOG_ELASTICSEARCH_HOSTS
          value: "http://elasticsearch:9200"
        - name: GRAYLOG_ROOT_TIMEZONE
          value: "UTC"
        ports:
        - containerPort: 9000
        - containerPort: 12201
          protocol: UDP
        - containerPort: 1514
        volumeMounts:
        - name: graylog-data
          mountPath: /usr/share/graylog/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: graylog-data
        hostPath:
          path: /data/graylog
          type: DirectoryOrCreate
      initContainers:
      - name: create-data-dir
        image: busybox
        command: ["mkdir", "-p", "/data/graylog"]
        volumeMounts:
        - name: graylog-data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: graylog
  labels:
    app: graylog
spec:
  type: LoadBalancer
  selector:
    app: graylog
  ports:
  - port: 9000
    targetPort: 9000
    name: web
  - port: 12201
    targetPort: 12201
    protocol: UDP
    name: gelf
  - port: 1514
    targetPort: 1514
    name: syslog
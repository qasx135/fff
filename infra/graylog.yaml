apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graylog-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graylog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graylog
  template:
    metadata:
      labels:
        app: graylog
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: graylog
          image: graylog/graylog:5.2
          ports:
            - containerPort: 9000
            - containerPort: 12201
              protocol: UDP
          env:
            - name: GRAYLOG_PASSWORD_SECRET
              value: "a-very-long-secret-that-is-at-least-16-chars"
            - name: GRAYLOG_ROOT_PASSWORD_SHA2
              value: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
            - name: GRAYLOG_HTTP_EXTERNAL_URI
              value: "http://anime.local:9000/"
          volumeMounts:
            - name: graylog-data
              mountPath: /usr/share/graylog/data
            - name: config
              mountPath: /usr/share/graylog/data/config
      volumes:
        - name: graylog-data
          persistentVolumeClaim:
            claimName: graylog-data
        - name: config
          emptyDir: {}  # ← вот ключевое изменение
---
apiVersion: v1
kind: Service
metadata:
  name: graylog
spec:
  selector:
    app: graylog
  ports:
    - name: web
      port: 9000
      targetPort: 9000
    - name: gelf-udp
      port: 12201
      protocol: UDP
      targetPort: 12201
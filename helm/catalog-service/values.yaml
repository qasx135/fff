replicaCount: 2
image:
  repository: catalog-service
  tag: "latest"
service:
  port: 8080
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
env:
  DB_DSN: "host=catalog-db-postgresql user=catalog_user password=catalog_pass dbname=catalog_db port=5432 sslmode=disable"
probes:
  liveness: { path: /healthz, initialDelaySeconds: 5 }
  readiness: { path: /ready, initialDelaySeconds: 3 }
  startup: { path: /startup, initialDelaySeconds: 10 }

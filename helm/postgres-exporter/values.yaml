replicaCount: 1

image:
  repository: prometheuscommunity/postgres-exporter
  tag: "v0.18.1"
  pullPolicy: IfNotPresent
app:
  name: service-name
service:
  type: ClusterIP
  port: 9187

resources:
  limits:
    cpu: 150m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

postgresql:
  host: catalog-db
  port: 5432
  database: catalog_db
  username: prometheus
  password: prom_pass
  sslmode: disable

env:
  DATA_SOURCE_NAME: "postgresql://postgres_monitor:monitor_pass@postgres-service:5432/service?sslmode=disable"

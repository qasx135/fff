apiVersion: apps/v1
kind: Deployment
metadata:
  name: graylog
  labels:
    app: graylog
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: graylog
  template:
    metadata:
      labels:
        app: graylog
    spec:
      restartPolicy: Always
      containers:
        - name: graylog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9000
            - containerPort: 12201
              protocol: UDP
          env:
            - name: GRAYLOG_PASSWORD_SECRET
              value: {{ .Values.env.GRAYLOG_PASSWORD_SECRET | quote }}
            - name: GRAYLOG_ROOT_PASSWORD_SHA2
              value: {{ .Values.env.GRAYLOG_ROOT_PASSWORD_SHA2 | quote }}
            - name: GRAYLOG_HTTP_EXTERNAL_URI
              value: {{ .Values.env.GRAYLOG_HTTP_EXTERNAL_URI | quote }}
            - name: GRAYLOG_ELASTICSEARCH_HOSTS
              value: {{ .Values.env.GRAYLOG_ELASTICSEARCH_HOSTS | quote }}
            - name: GRAYLOG_MONGODB_URI
              value: {{ .Values.env.GRAYLOG_MONGODB_URI | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/system/lbstatus
              port: 9000
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/system/lbstatus
              port: 9000
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          startupProbe:
            httpGet:
              path: /api/system/lbstatus
              port: 9000
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
---
apiVersion: v1
kind: Service
metadata:
  name: graylog-service
  labels:
    app: graylog
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9000
      name: http
    - port: {{ .Values.service.gelfPort }}
      targetPort: 12201
      protocol: UDP
      name: gelf
  selector:
    app: graylog
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graylog-hpa
  labels:
    app: graylog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: graylog
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}

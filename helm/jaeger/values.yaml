replicaCount: 1

image:
  repository: jaegertracing/all-in-one
  tag: "1.50.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ui:
    port: 16686
  collector:
    port: 14268
  agent:
    port: 6831
    protocol: UDP

resources:
  limits:
    cpu: 300m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

probes:
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 60

env:
  COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
  COLLECTOR_OTLP_ENABLED: true
  LOG_LEVEL: info
